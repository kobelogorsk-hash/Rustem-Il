<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Clone - BladGreen</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            background: transparent; border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
            z-index: 10;
        }
        #crosshair::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background: white; transform: translate(-50%, -50%);
        }
        #ui {
            position: absolute; top: 10px; left: 10px; color: white;
            text-shadow: 2px 2px 0 #000; font-size: 18px; pointer-events: none;
            z-index: 10;
        }
        #instructions {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; text-align: center; background: rgba(0,0,0,0.7);
            padding: 20px; border-radius: 10px; cursor: pointer;
            z-index: 20;
        }
        .slot {
            display: inline-block; width: 40px; height: 40px; border: 2px solid gray;
            background: rgba(0,0,0,0.5); margin: 0 2px; vertical-align: bottom;
        }
        .active { border-color: white; }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui">
        <div>Игрок: <b style="color:#55FF55">BladGreen</b></div>
        <div>Блоков в мире: <span id="block-count">0</span></div>
        <div style="margin-top:10px;">
            <div class="slot active" id="slot1" style="background:green;"></div>
            <div class="slot" id="slot2" style="background:brown;"></div>
            <div class="slot" id="slot3" style="background:gray;"></div>
            <div class="slot" id="slot4" style="background:white;"></div>
        </div>
        <div style="font-size: 12px; margin-top: 5px;">[1-4] Выбор блока</div>
    </div>
    <div id="instructions">
        <h1>Minecraft JS Prototype</h1>
        <p>Кликни, чтобы начать</p>
        <p>WASD - Ходить | SPACE - Прыжок</p>
        <p>ЛКМ - Ломать | ПКМ - Строить</p>
        <p>1-4 - Выбор блока</p>
    </div>

    <!-- Подключаем Three.js через CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- КОНФИГУРАЦИЯ ---
        const WORLD_SIZE = 60; // Размер мира (квадратный)
        const BLOCK_SIZE = 1;
        
        // Цвета блоков
        const COLORS = {
            GRASS: 0x559c44,
            DIRT: 0x5d4037,
            STONE: 0x757575,
            WOOD: 0x5d4037,
            LEAVES: 0x2e7d32,
            VILLAGER: 0x55ff55, // Зеленый житель
            GOLEM: 0xffffff,   // Белый голем
            HOUSE_WALL: 0xc2b280,
            HOUSE_ROOF: 0x8d6e63
        };

        let camera, scene, renderer, controls;
        const objects = []; // Массив всех блоков для коллизии и рейкастинга
        let raycaster;
        
        // Переменные движения
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let canJump = false;
        
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        
        // Инвентарь
        let currentBlockType = 'GRASS';
        const blockTypes = ['GRASS', 'WOOD', 'STONE', 'GOLEM'];

        // Материалы (упрощенные, без текстур для производительности в одном файле)
        const materials = {};
        
        function initMaterials() {
            const loader = new THREE.TextureLoader();
            // Создаем простые цветные материалы с эффектом "квадратности" (flat shading)
            for (const [key, color] of Object.entries(COLORS)) {
                materials[key] = new THREE.MeshLambertMaterial({ 
                    color: color, 
                    flatShading: true 
                });
            }
            // Специальный материал для выделения
            materials.highlight = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true, transparent: true, opacity: 0.3 });
        }

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Небесно-голубой
            scene.fog = new THREE.Fog(0x87CEEB, 10, 60);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 2; // Высота глаз игрока

            // Свет
            const ambientLight = new THREE.AmbientLight(0xcccccc, 0.6);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Контролы
            controls = new PointerLockControls(camera, document.body);

            const instructions = document.getElementById('instructions');
            instructions.addEventListener('click', () => {
                controls.lock();
            });

            controls.addEventListener('lock', () => {
                instructions.style.display = 'none';
            });
            controls.addEventListener('unlock', () => {
                instructions.style.display = 'block';
            });

            scene.add(controls.getObject());

            // Обработчики клавиш
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight': case 'KeyD': moveRight = true; break;
                    case 'Space': if (canJump === true) velocity.y += 15; canJump = false; break;
                    case 'Digit1': selectBlock(0); break;
                    case 'Digit2': selectBlock(1); break;
                    case 'Digit3': selectBlock(2); break;
                    case 'Digit4': selectBlock(3); break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight': case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseClick);

            // Рейкастер для взаимодействия
            raycaster = new THREE.Raycaster();
            raycaster.far = 8; // Дистанция взаимодействия

            initMaterials();
            generateWorld();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        function selectBlock(index) {
            currentBlockType = blockTypes[index];
            document.querySelectorAll('.slot').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
        }

        function createBlock(x, y, z, typeKey) {
            const geometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            const material = materials[typeKey] || materials['GRASS'];
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(x, y, z);
            cube.name = typeKey; // Сохраняем тип в имени
            scene.add(cube);
            objects.push(cube);
            updateBlockCount();
            return cube;
        }

        function generateWorld() {
            // 1. Супер-плоский мир (трава)
            const offset = WORLD_SIZE / 2;
            for (let x = -offset; x < offset; x++) {
                for (let z = -offset; z < offset; z++) {
                    createBlock(x, 0, z, 'GRASS');
                }
            }

            // 2. Генерация "деревень"
            // Простая логика: ставим структуры в случайных местах, но не слишком близко к центру (спавну)
            const numVillages = 5;
            
            for(let i=0; i<numVillages; i++) {
                const vx = Math.floor((Math.random() - 0.5) * (WORLD_SIZE - 10));
                const vz = Math.floor((Math.random() - 0.5) * (WORLD_SIZE - 10));
                
                // Если слишком близко к спавну, пропускаем
                if(Math.abs(vx) < 5 && Math.abs(vz) < 5) continue;

                buildHouse(vx, vz);
                spawnVillager(vx, vz);
                if(Math.random() > 0.5) spawnGolem(vx, vz);
            }
            
            // Спавн игрока чуть выше земли
            controls.getObject().position.set(0, 2, 0);
        }

        function buildHouse(x, z) {
            const size = 3 + Math.floor(Math.random() * 2); // 3x3 или 4x4
            const height = 3;
            
            // Стены
            for(let y=1; y<=height; y++) {
                for(let dx=0; dx<size; dx++) {
                    for(let dz=0; dz<size; dz++) {
                        // Только периметр
                        if(dx===0 || dx===size-1 || dz===0 || dz===size-1) {
                            // Окно или дверь спереди
                            if(dz===0 && y===1 && dx===Math.floor(size/2)) continue; // Дверь
                            if(dz===size-1 && y===2 && dx===Math.floor(size/2)) {
                                createBlock(x+dx, y, z+dz, 'LEAVES'); // Стекло (листья как замена)
                            } else {
                                createBlock(x+dx, y, z+dz, 'HOUSE_WALL');
                            }
                        } else if (y === 1) {
                            createBlock(x+dx, y, z+dz, 'DIRT'); // Пол
                        }
                    }
                }
            }
            
            // Крыша (плоская для упрощения, но с другим цветом)
            for(let dx=-1; dx<size; dx++) {
                for(let dz=-1; dz<size; dz++) {
                    createBlock(x+dx, height+1, z+dz, 'HOUSE_ROOF');
                }
            }
        }

        function spawnVillager(x, z) {
            // Житель - маленький зеленый блок внутри дома
            createBlock(x+1.5, 1.5, z+1.5, 'VILLAGER');
        }

        function spawnGolem(x, z) {
            // Голем - высокий белый столб рядом с домом
            createBlock(x+size+1, 1, z+1, 'GOLEM');
            createBlock(x+size+1, 2, z+1, 'GOLEM');
            createBlock(x+size+1, 3, z+1, 'GOLEM');
            // Голова
            createBlock(x+size+1, 4, z+1, 'GOLEM'); 
        }
        
        // Переменная размера дома для доступа из spawnGolem (костыль для простоты)
        let size = 3; 

        function onMouseClick(event) {
            if (!controls.isLocked) return;

            // Центр экрана
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(objects);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                
                // ЛКМ (0) - Удалить, ПКМ (2) - Поставить
                if (event.button === 0) {
                    // Нельзя ломать коренную породу (если бы она была) или самого себя
                    if(intersect.object.name !== 'BEDROCK') {
                        scene.remove(intersect.object);
                        objects.splice(objects.indexOf(intersect.object), 1);
                        updateBlockCount();
                    }
                } else if (event.button === 2) {
                    const pos = intersect.point.add(intersect.face.normal.multiplyScalar(0.5)).floor();
                    
                    // Проверка, не ставим ли блок в себя
                    const playerPos = controls.getObject().position;
                    const dx = Math.abs(pos.x - playerPos.x);
                    const dy = Math.abs(pos.y - playerPos.y); // Ноги
                    const dyHead = Math.abs(pos.y - (playerPos.y - 1)); // Голова
                    const dz = Math.abs(pos.z - playerPos.z);
                    
                    // Простая проверка коллизии при установке
                    if (dx < 0.8 && dz < 0.8 && (dy < 1.8 || dyHead < 1.8)) {
                        return; // Место занято игроком
                    }

                    createBlock(pos.x, pos.y, pos.z, currentBlockType);
                }
            }
        }

        function updateBlockCount() {
            document.getElementById('block-count').innerText = objects.length;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            
            if (controls.isLocked === true) {
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 5.0 * delta; // Гравитация (масса 100.0)

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                
                controls.getObject().position.y += (velocity.y * delta);

                // Простая коллизия с полом
                // Raycast вниз от игрока
                const playerPos = controls.getObject().position.clone();
                const downRay = new THREE.Raycaster(playerPos, new THREE.Vector3(0, -1, 0), 0, 2);
                const hits = downRay.intersectObjects(objects);

                if (hits.length > 0) {
                    // Стоим на блоке
                    if (velocity.y < 0) {
                        velocity.y = 0;
                        controls.getObject().position.y = hits[0].point.y + 1.5; // Высота глаз + половина роста
                        canJump = true;
                    }
                }
                
                // Если упали ниже мира, респаун
                if (controls.getObject().position.y < -10) {
                    velocity.y = 0;
                    controls.getObject().position.set(0, 10, 0);
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
